<p-menubar [model]="items">
  <ng-template #end >
    <div>
      <a href="/#Inicio" (click)="onLogoClick($event)" aria-label="GarageMeet, ir al inicio"
        class="text-xl sm:text-2xl md:text-3xl font-bold text-white hover:text-blue-300 transition-colors duration-200">
        GarageMeet
      </a>
    </div>
  </ng-template>
  <ng-template #item let-item>
    <div class="flex items-center">
      @if (item.routerLink) {
        <a [routerLink]="item.routerLink"
           routerLinkActive="router-link-active"
           pRipple
           class="p-menubar-item-link text-gray-300 hover:text-white transition-colors duration-300 font-medium">
          <span>{{ item.label }}</span>
          <i [class]="item.icon" *ngIf="item.icon" class="ml-2" aria-hidden="true"></i>
        </a>
      } @else {
        <button type="button" (click)="onCustomItemClick($event, item)" pRipple
          class="p-menubar-item-link text-gray-300 hover:text-white transition-colors duration-300 font-medium">
          <span>{{ item.label }}</span>
          <i [class]="item.icon" *ngIf="item.icon" class="ml-2" aria-hidden="true"></i>
        </button>
      }
    </div>
  </ng-template>
</p-menubar>
