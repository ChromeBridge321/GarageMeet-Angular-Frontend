<div class="dashboard-card">
  <div class="dashboard-card-header">
    <h3 class="dashboard-title">Tipos de Pago</h3>
    <p-button
      type="button"
      pRipple
      (click)="showDialog(false)"
      label="Nuevo Tipo de Pago"
      icon="pi pi-plus"
      [disabled]="!canModifyData"
      pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para crear tipos de pago' : 'Crear un nuevo tipo de pago'}}"
      tooltipPosition="top"
    />
  </div>

  <div class="dashboard-card-content">
    <!-- Barra de control -->
    <div class="flex items-center justify-content-between align-items-center mb-4">
      <div class="flex align-items-center gap-3">
        <p-button
          icon="pi pi-filter-slash"
          label="Limpiar Filtros"
          severity="secondary"
          size="small"
          (onClick)="limpiarFiltros(dt1)"
          pTooltip="Limpiar todos los filtros aplicados">
        </p-button>
      </div>
      <div class="ps-4 flex align-items-center gap-2">
        <span class="text-sm text-gray-600">{{ paymentTypes.length }} tipo(s) de pago total(es)</span>
      </div>
    </div>

    <p-table
      showGridlines
      [value]="paymentTypes"
      [tableStyle]="{ 'min-width': 'auto' }"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10]"
      paginatorDropdownAppendTo="body"
      [globalFilterFields]="['name']"
      #dt1>
      <ng-template #header>
        <tr>
          <th>N.</th>
          <th pSortableColumn="name">
            Nombre
            <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th>Acciones</th>
        </tr>
        <tr>
          <th></th>
          <th>
            <input pInputText type="text" (input)="dt1.filter($any($event.target).value, 'name', 'contains')"
                   placeholder="Filtrar por nombre" class="w-full" />
          </th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-paymentType let-index="rowIndex">
        <tr>
          <td>{{ index + 1 }}</td>
          <td>{{ paymentType.name }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                (click)="showDialog(true, paymentType.payment_types_id)"
                type="button"
                pRipple
                icon="pi pi-pencil"
                severity="secondary"
                size="small"
                [text]="true"
                [disabled]="!canModifyData"
                pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para editar' : 'Editar Tipo de Pago'}}"
                tooltipPosition="top"
              />
              <p-button
                (click)="delete(paymentType.payment_types_id)"
                type="button"
                pRipple
                icon="pi pi-trash"
                severity="danger"
                size="small"
                [text]="true"
                [disabled]="!canModifyData"
                pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para eliminar' : 'Eliminar Tipo de Pago'}}"
                tooltipPosition="top"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast />
<p-confirmDialog />

<p-dialog header="{{ title.title }}" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }">
  <form (ngSubmit)="isEdit ? updatePaymentType() : createPaymentType()" [formGroup]="paymentTypeForm">
    <span class="p-text-secondary block mb-8">{{ title.subTitle }}</span>

    <div class="flex items-center gap-4 mb-4">
      <label for="name" class="font-semibold w-24">Nombre</label>
      <input pInputText id="name" class="flex-auto" autocomplete="off" formControlName="name" />
    </div>
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" (click)="resetForm()" />
      <p-button label="Guardar" [disabled]="paymentTypeForm.invalid" type="submit" />
    </div>
  </form>
</p-dialog>

<!-- Toast Messages -->
<p-confirmDialog />
<p-toast />
