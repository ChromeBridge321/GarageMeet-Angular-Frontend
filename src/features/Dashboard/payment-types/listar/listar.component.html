<section class="mx-5 mt-5 sm:mx-10 md:mx-20 lg:mx-50">
  <div class="mb-5">
    <h3 class="text-xl font-bold">Tipos de Pago</h3>
  </div>
  <p-button
    (click)="showDialog(false)"
    type="button"
    pRipple
    label="Crear Tipo de Pago"
    class="mb-5"
    [disabled]="!canModifyData"
    pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para crear tipos de pago' : 'Crear un nuevo tipo de pago'}}"
    tooltipPosition="top"
  />
  <p-table
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    stripedRows
    showGridlines
    [value]="paymentTypes"
    [tableStyle]="{ 'min-width': 'auto' }"
    [loading]="loading"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]">
    <ng-template pTemplate="header">
      <tr>
        <th>N.</th>
        <th pSortableColumn="name">
          Nombre <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="description">
          Descripción <p-sortIcon field="description" />
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-paymentType let-index="rowIndex">
      <tr>
        <td>{{ index + 1 }}</td>
        <td>{{ paymentType.name }}</td>
        <td>
          <p-button
            (click)="showDialog(true, paymentType.payment_types_id)"
            type="button"
            pRipple
            icon="pi pi-pencil"
            class="mr-2"
            severity="secondary"
            [disabled]="!canModifyData"
            pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para editar' : 'Editar Tipo de Pago'}}"
            tooltipPosition="top"
          />
          <p-button
            (click)="delete(paymentType.payment_types_id)"
            type="button"
            pRipple
            icon="pi pi-trash"
            severity="danger"
            [disabled]="!canModifyData"
            pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para eliminar' : 'Eliminar Tipo de Pago'}}"
            tooltipPosition="top"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>

<p-dialog header="{{ title.title }}" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }">
  <form (ngSubmit)="isEdit ? updatePaymentType() : createPaymentType()" [formGroup]="paymentTypeForm">
    <span class="p-text-secondary block mb-8">{{ title.subTitle }}</span>

    <div class="flex items-center gap-4 mb-4">
      <label for="name" class="font-semibold w-24">Nombre</label>
      <input pInputText id="name" class="flex-auto" autocomplete="off" formControlName="name" />
    </div>
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" (click)="resetForm()" />
      <p-button label="Guardar" [disabled]="paymentTypeForm.invalid" type="submit" />
    </div>
  </form>
</p-dialog>

<!-- Toast Messages -->
<p-confirmDialog />
<p-toast />
