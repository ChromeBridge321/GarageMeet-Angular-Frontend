<section class="mx-5 mt-5 sm:mx-10 md:mx-20 lg:mx-50">
  <div class="mb-5">
    <h3 class="text-xl font-bold
      ">Empleados</h3>
  </div>
  <p-button
    type="button"
    pRipple
    [routerLink]="canModifyData ? ['/panel/empleados/crear'] : null"
    (click)="!canModifyData && showSubscriptionError()"
    label="Crear Empleado"
    class="mb-5"
    [disabled]="!canModifyData"
    pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para crear empleados' : 'Crear un nuevo empleado'}}"
    tooltipPosition="top"
  />
  <p-table showGridlines [value]="employees" [tableStyle]="{ 'min-width': 'auto' }" [loading]="loading">
    <ng-template #header>
      <tr>
        <th>N.</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Cargo</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-employee let-index="rowIndex">
      <tr>
        <td>{{ index + 1 }}</td>
        <td>{{ employee.person.name + ' ' + employee.person.last_name}}</td>
        <td>{{ employee.person.cellphone_number }}</td>
        <td>{{ employee.person.email }}</td>
        <td>{{ employee.positions[0]?.name }}</td>
        <td class="flex justify-center md:justify-between lg:justify-around">
          <p-button
            type="button"
            pRipple
            [routerLink]="canModifyData ? ['/panel/empleados/editar', employee.employees_id] : null"
            (click)="!canModifyData && showSubscriptionError()"
            icon="pi pi-pencil"
            class="mr-2"
            severity="secondary"
            [disabled]="!canModifyData"
            pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para editar' : 'Editar Empleado'}}"
            tooltipPosition="top"
          />
          <p-button
            type="button"
            pRipple
            icon="pi pi-trash"
            severity="danger"
            [disabled]="!canModifyData"
            pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para eliminar' : 'Eliminar Empleado'}}"
            tooltipPosition="top"
            (click)="delete(employee.person.peoples_id)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-toast />
  <p-confirmDialog />
</section>
