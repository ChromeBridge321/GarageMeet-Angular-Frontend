<section class="dashboard-container h-dvh w-full overflow-y-hidden">

  <nav class="flex-1 z-10 sticky top-0 bg-white border-b border-gray-200 shadow-sm">
    <p-menubar >
      <ng-template pTemplate="start">
        <p-button icon="pi pi-bars" (click)="visible1 = true" class="md:hidden" variant="text" severity="secondary">
        </p-button>
        <div class="ms-4 py-2">
          <h3 class="text-xl font-bold text-blue-600">
            GarageMeet
          </h3>
        </div>
      </ng-template>
      <ng-template pTemplate="end">
        <p-button icon="pi pi-user" [rounded]="true" severity="info" [outlined]="true" (click)="menu.toggle($event)" />
        <p-tieredmenu #menu [model]="items" [popup]="true" />
      </ng-template>
    </p-menubar>
  </nav>

  <div class="flex flex-row h-full">
    <aside
      class="overflow-y-auto h-full pb-24 border-r sticky top-0 border-gray-200 bg-white hidden md:block md:w-54 lg:w-70">
      <div class="p-4">
        <p-menu [style]="{border: 0}" [model]="itemsMenu" />
      </div>
    </aside>

    <main class="flex-1 p-6 overflow-y-scroll bg-gray-50">
      <router-outlet></router-outlet>
    </main>

    <p-drawer [baseZIndex]="10000" [(visible)]="visible1" position="left">
      <ng-template #header>
        <a routerLink="/panel" class="w-full flex justify-center items-center">
          <span class="text-xl font-bold text-blue-600">GarageMeet</span>
        </a>
      </ng-template>
      <ng-template #content>
        <p-menu [style]="{border: 0}" [model]="itemsMenu" />
      </ng-template>
    </p-drawer>
  </div>

</section>

<!-- Toast para mensajes -->
<p-toast position="top-right"></p-toast>
