<section class="h-dvh w-full overflow-y-hidden">

  <nav class="flex-1 z-1 sticky top-0 bg-white border-b border-zinc-200 shadow-sm">
    <p-menubar [model]="items">
      <ng-template pTemplate="start">
        <p-button icon="pi pi-bars" (click)="visible1 = true" class="md:hidden" variant="text"
          severity="secondary"></p-button>
        <div class="ms-4 py-2">
          <h3 class="text-xl font-bold">
            GarageMeet
          </h3>
        </div>
      </ng-template>
    </p-menubar>
  </nav>
  <div class="flex flex-row h-full">
    <aside
      class=" overflow-y-auto h-full pb-24 border-r sticky top-0 border-zinc-200 bg-white hidden md:block md:w-54 lg:w-70">
      <p-menu [style]="{border: 0}" [model]="itemsMenu" />
      <!-- <p-panelmenu [model]="itemsMenu" styleClass="w-full md:w-20rem" /> -->
    </aside>
    <main class="flex-1 p-6 overflow-y-scroll">
      <router-outlet></router-outlet>
    </main>

    <p-drawer [baseZIndex]="10000" [(visible)]="visible1" position="left">
      <ng-template #header>
        <a routerLink="/panel" class="w-full flex justify-center items-center"><span
            class="text-xl font-bold">Menu</span></a>
      </ng-template>
      <ng-template #content>
        <p-menu [style]="{border: 0}" [model]="itemsMenu" />
      </ng-template>
    </p-drawer>
  </div>

</section>

<!-- Toast para mensajes -->
<p-toast position="top-right"></p-toast>
