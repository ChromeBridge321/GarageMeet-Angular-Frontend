<nav class="flex-1 z-1">
  <p-menubar [model]="items">
    <ng-template pTemplate="start">
      <p-button icon="pi pi-bars" (click)="visible1 = true" class="p-button-outlined"></p-button>
      <div class="ms-4">
        <h3 class="text-xl font-bold">
          GarageMeet
        </h3>
      </div>
    </ng-template>
  </p-menubar>
</nav>
<p-drawer [baseZIndex]="10000" [(visible)]="visible1" position="left">
  <ng-template #header>
    <a routerLink="/panel" class="w-full flex justify-center items-center"><span class="text-xl font-bold">Menu</span></a>
  </ng-template>
  <ng-template #content>
    <p-panelmenu [model]="itemsMenu" [style]="{'width':'auto'}" [multiple]="true" />
  </ng-template>
</p-drawer>
<router-outlet></router-outlet>
