<div class="dashboard-card">
  <div class="dashboard-card-header">
    <h3 class="dashboard-title">Cargos</h3>
    <p-button
      type="button"
      pRipple
      (click)="showDialog(false)"
      label="Nuevo Cargo"
      icon="pi pi-plus"
      [disabled]="!canModifyData"
      pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para crear cargos' : 'Crear un nuevo cargo'}}"
      tooltipPosition="top"
    />
  </div>

  <div class="dashboard-card-content">
    <!-- Barra de control -->
    <div class="flex w-full justify-content-between items-center align-items-center mb-4">
      <div class="flex align-items-center">
        <p-button
          icon="pi pi-filter-slash"
          label="Limpiar Filtros"
          severity="secondary"
          size="small"
          (onClick)="limpiarFiltros(dt1)"
          pTooltip="Limpiar todos los filtros aplicados">
        </p-button>
      </div>
      <div class="ps-4 flex align-items-center">
        <span class="text-sm text-gray-600">{{ positions.length }} cargo(s) total(es)</span>
      </div>
    </div>

    <p-table
      showGridlines
      [value]="positions"
      [tableStyle]="{ 'min-width': 'auto' }"
      [loading]="loading"
      [globalFilterFields]="['name']"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      paginatorDropdownAppendTo="body"
      #dt1>
      <ng-template #header>
        <tr>
          <th>N.</th>
          <th pSortableColumn="name">
            Nombre
            <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th>Acciones</th>
        </tr>
        <tr>
          <th></th>
          <th>
            <input pInputText type="text" (input)="dt1.filter($any($event.target).value, 'name', 'contains')"
                   placeholder="Filtrar por nombre" class="w-full" />
          </th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-position let-index="rowIndex">
        <tr>
          <td>{{ index + 1 }}</td>
          <td>{{ position.name }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                (click)="showDialog(true, position.positions_id)"
                type="button"
                pRipple
                icon="pi pi-pencil"
                severity="secondary"
                size="small"
                [disabled]="!canModifyData"
                pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para editar' : 'Editar Cargo'}}"
                tooltipPosition="top"
              />
              <p-button
                (click)="deletePosition(position)"
                type="button"
                pRipple
                icon="pi pi-trash"
                severity="danger"
                size="small"
                [disabled]="!canModifyData"
                pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para eliminar' : 'Eliminar Cargo'}}"
                tooltipPosition="top"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast />
<p-confirmDialog />

<div class="card flex justify-center">
  <p-dialog header="{{ title.title }}" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <form (ngSubmit)="isEdit ? updatePosition() : createPosition()" [formGroup]="positionForm">
      <span class="p-text-secondary block mb-8">{{ title.subTitle }}</span>
      <div class="flex items-center gap-4 mb-4">
        <label for="name" class="font-semibold w-24">Nombre</label>
        <input pInputText id="name" class="flex-auto" autocomplete="off" formControlName="name" />
      </div>
      <div class="flex justify-end gap-2">
        <p-button label="Cancelar" severity="secondary" (click)="resetForm()" />
        <p-button label="Guardar" [disabled]="positionForm.invalid" type="submit" />
      </div>
    </form>
  </p-dialog>
</div>
