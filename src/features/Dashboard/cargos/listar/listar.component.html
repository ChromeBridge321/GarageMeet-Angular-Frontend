<!-- Cargos List Section -->
<section class="p-6 md:p-8 lg:p-12 max-w-6xl mx-auto">
  <!-- Header Section -->
  <div class="mb-8">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold section-title text-green-800">Cargos</h1>
        <p class="text-gray-600 mt-2">Administra los roles y posiciones del taller</p>
      </div>
      <div class="flex gap-3">
        <p-button
          (click)="showDialog(false)"
          type="button"
          pRipple
          label="Nuevo Cargo"
          icon="pi pi-plus"
          class="flex-shrink-0 shadow-lg hover:shadow-xl transition-all duration-300" />
      </div>
    </div>
  </div>

  <!-- Positions Table Card -->
  <div class="minimal-card bg-white rounded-2xl overflow-hidden shadow-lg">
    <div class="p-6 bg-gradient-to-r from-green-50 to-green-100 border-b border-green-200">
      <h3 class="text-lg font-semibold text-green-800 flex items-center gap-2">
        <i class="pi pi-briefcase text-green-600"></i>
        Lista de Cargos
      </h3>
    </div>

    <div class="p-6">
      <p-table
        [value]="positions"
        [tableStyle]="{ 'min-width': 'auto' }"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} cargos"
        [rowsPerPageOptions]="[10, 25, 50]"
        class="minimal-table">

        <ng-template #header>
          <tr>
            <th class="text-center w-16">
              <div class="flex items-center justify-center">
                <i class="pi pi-hashtag text-green-600"></i>
              </div>
            </th>
            <th>
              <div class="flex items-center gap-2">
                <i class="pi pi-briefcase text-green-600"></i>
                Nombre del Cargo
              </div>
            </th>
            <th class="text-center">
              <div class="flex items-center justify-center gap-2">
                <i class="pi pi-cog text-green-600"></i>
                Acciones
              </div>
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-position let-index="rowIndex">
          <tr class="hover:bg-green-50/50 transition-colors duration-200">
            <td class="text-center">
              <div class="w-8 h-8 bg-gradient-to-br from-green-100 to-green-200 rounded-full flex items-center justify-center font-semibold text-green-700 text-sm">
                {{ index + 1 }}
              </div>
            </td>
            <td>
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-400 to-purple-600 rounded-full flex items-center justify-center text-white">
                  <i class="pi pi-briefcase"></i>
                </div>
                <div>
                  <p class="font-semibold text-gray-900">{{ position.name }}</p>
                  <p class="text-sm text-gray-500">Cargo del taller</p>
                </div>
              </div>
            </td>
            <td>
              <div class="flex items-center justify-center gap-2">
                <p-button
                  (click)="showDialog(true, position.positions_id)"
                  type="button"
                  pRipple
                  icon="pi pi-pencil"
                  severity="secondary"
                  tooltip="Editar Cargo"
                  tooltipPosition="top"
                  class="!w-10 !h-10 !p-0 !rounded-full hover:scale-110 transition-transform duration-200" />
                <p-button
                  (click)="delete(position.positions_id)"
                  type="button"
                  pRipple
                  icon="pi pi-trash"
                  severity="danger"
                  tooltip="Eliminar Cargo"
                  tooltipPosition="top"
                  class="!w-10 !h-10 !p-0 !rounded-full hover:scale-110 transition-transform duration-200" />
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template #empty>
          <tr>
            <td colspan="3" class="text-center py-12">
              <div class="flex flex-col items-center gap-4">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center">
                  <i class="pi pi-briefcase text-gray-400 text-2xl"></i>
                </div>
                <div>
                  <p class="text-lg font-medium text-gray-500">No hay cargos registrados</p>
                  <p class="text-gray-400">Comienza creando el primer cargo</p>
                </div>
                <p-button
                  (click)="showDialog(false)"
                  type="button"
                  pRipple
                  label="Crear Cargo"
                  icon="pi pi-plus"
                  class="mt-2" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</section>

<!-- Cargo Modal Dialog -->
<div class="cargo-dialog">
  <p-dialog
    header="{{ title.title }}"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '480px' }"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    class="custom-dialog">

    <form (ngSubmit)="isEdit ? updatePosition() : createPosition()" [formGroup]="positionForm" class="space-y-6">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-purple-400 to-purple-600 rounded-xl mb-3">
          <i class="pi pi-briefcase text-white text-lg"></i>
        </div>
        <p class="text-gray-600">{{ title.subTitle }}</p>
      </div>

      <div class="space-y-4">
        <div class="space-y-2">
          <label for="name" class="block text-sm font-medium text-gray-700">Nombre del Cargo *</label>
          <input
            pInputText
            id="name"
            class="w-full !rounded-xl !border-2 !border-gray-200 hover:!border-green-300 focus:!border-green-400 transition-colors !px-4 !py-3"
            autocomplete="off"
            formControlName="name"
            placeholder="Ej: Mecánico, Jefe de Taller..." />
          <small
            class="text-red-500 text-sm flex items-center gap-1"
            *ngIf="positionForm.get('name')?.invalid && positionForm.get('name')?.touched">
            <i class="pi pi-exclamation-triangle"></i>
            El nombre del cargo es requerido
          </small>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
        <p-button
          label="Cancelar"
          severity="secondary"
          (click)="resetForm()"
          icon="pi pi-times"
          class="shadow-lg hover:shadow-xl transition-all duration-300" />
        <p-button
          label="{{ isEdit ? 'Actualizar' : 'Guardar' }}"
          [disabled]="positionForm.invalid"
          type="submit"
          icon="pi pi-check"
          class="shadow-lg hover:shadow-xl transition-all duration-300" />
      </div>
    </form>
  </p-dialog>

  <!-- Toast and Confirm Dialog -->
  <p-confirmDialog />
  <p-toast position="top-right" />
</div>
