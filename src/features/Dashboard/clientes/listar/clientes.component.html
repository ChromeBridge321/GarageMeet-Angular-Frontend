<section class="mx-5 mt-5 sm:mx-10 md:mx-20 lg:mx-50">
  <div class="mb-5">
    <h3 class="text-xl font-bold">Clientes</h3>
  </div>

  <p-button
    type="button"
    pRipple
    [routerLink]="canModifyData ? ['/panel/clientes/crear'] : null"
    (click)="!canModifyData && showSubscriptionError()"
    label="Crear Cliente"
    class="mb-5"
    [disabled]="!canModifyData"
    pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para crear clientes' : 'Crear un nuevo cliente'}}"
    tooltipPosition="top"
  />

  <!-- Barra de control -->
  <div class="flex justify-content-between align-items-center mb-4">
    <div class="flex align-items-center gap-3">
      <p-button
        icon="pi pi-filter-slash"
        label="Limpiar Filtros"
        severity="secondary"
        size="small"
        (onClick)="limpiarFiltros(dt1)"
        pTooltip="Limpiar todos los filtros aplicados">
      </p-button>
    </div>
    <div class="flex align-items-center gap-2">
      <span class="text-sm text-gray-600">{{ clients.length }} cliente(s) total(es)</span>
    </div>
  </div>

  <p-table showGridlines [value]="clients" [tableStyle]="{ 'min-width': 'auto' }" [loading]="loading"
    [globalFilterFields]="['person.name', 'person.last_name', 'person.cellphone_number', 'person.email', 'vehicles.0.make', 'vehicles.0.model']"
    [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" #dt1>
    <ng-template #header>
      <tr>
        <th>N.</th>
        <th pSortableColumn="person.name">
          Nombre
          <p-sortIcon field="person.name"></p-sortIcon>
        </th>
        <th pSortableColumn="person.cellphone_number">
          Teléfono
          <p-sortIcon field="person.cellphone_number"></p-sortIcon>
        </th>
        <th pSortableColumn="person.email">
          Correo
          <p-sortIcon field="person.email"></p-sortIcon>
        </th>
        <th pSortableColumn="vehicles.0.make">
          Vehículo
          <p-sortIcon field="vehicles.0.make"></p-sortIcon>
        </th>
        <th>Acciones</th>
      </tr>
      <tr>
        <th></th>
        <th>
          <input pInputText type="text" (input)="dt1.filter($any($event.target).value, 'person.name', 'contains')"
                 placeholder="Filtrar por nombre" class="w-full" />
        </th>
        <th>
          <input pInputText type="text" (input)="dt1.filter($any($event.target).value, 'person.cellphone_number', 'contains')"
                 placeholder="Filtrar por teléfono" class="w-full" />
        </th>
        <th>
          <input pInputText type="text" (input)="dt1.filter($any($event.target).value, 'person.email', 'contains')"
                 placeholder="Filtrar por correo" class="w-full" />
        </th>
        <th>
          <input pInputText type="text" (input)="dt1.filter($any($event.target).value, 'vehicles.0.make', 'contains')"
                 placeholder="Filtrar por vehículo" class="w-full" />
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-client let-index="rowIndex">
      <tr>
        <td>{{ index + 1 }}</td>
        <td>{{ client.person.name + ' ' + client.person.last_name }}</td>
        <td>{{ client.person.cellphone_number }}</td>
        <td>{{ client.person.email }}</td>
        <td>{{ client.vehicles[0]?.make + ' ' + client.vehicles[0]?.model }}</td>
        <td>
          <p-button
            type="button"
            pRipple
            [routerLink]="canModifyData ? ['/panel/clientes/editar/', client.clients_id] : null"
            (click)="!canModifyData && showSubscriptionError()"
            icon="pi pi-pencil"
            severity="secondary"
            [disabled]="!canModifyData"
            pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para editar' : 'Editar Cliente'}}"
            tooltipPosition="top"
          />
          <p-button
            type="button"
            pRipple
            icon="pi pi-trash"
            severity="danger"
            [disabled]="!canModifyData"
            pTooltip="{{!canModifyData ? 'Necesitas una suscripción activa para eliminar' : 'Eliminar Cliente'}}"
            tooltipPosition="top"
            (click)="delete(client.person.peoples_id)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-toast />
  <p-confirmDialog />
</section>
