<section class="mx-5 mt-5 sm:mx-10 md:mx-20 lg:mx-40">
  <div class="mb-5">
    <h3 class="text-xl font-bold

      ">Vehiculos</h3>
  </div>
  <p-table showGridlines [value]="clients" [tableStyle]="{ 'min-width': 'auto' }" [loading]="loading">
    <ng-template #header>
      <tr>
        <th>Id</th>
        <th>Cliente</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Placas</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-clients let-index="rowIndex">
      <tr>
        <td>{{ index + 1 }}</td>
        <td>{{ clients.person.name + ' ' + clients.person.last_name}}</td>
        <td>{{ clients.vehicles[0]?.make }}</td>
        <td>{{ clients.vehicles[0]?.model }}</td>
        <td>{{ clients.vehicles[0]?.plates }}</td>
        <td>
          <p-button type="button" pRipple [routerLink]="['/panel/clientes/editar', clients.id]" icon="pi pi-pencil"
            class="mr-2" severity="secondary" tooltip="Editar Cliente" />
          <p-button type="button" pRipple icon="pi pi-trash" severity="danger" tooltip="Eliminar Cliente" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
