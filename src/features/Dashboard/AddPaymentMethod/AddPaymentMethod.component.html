<div class="mx-5 mt-5 sm:mx-10 md:mx-20 lg:mx-50 xl:mx-70">
  <!-- Page Title -->
  <div class="font-bold flex text-4xl justify-center items-center mt-5">
    <h1>Agregar Método de Pago</h1>
  </div>

  <!-- Card Form -->
  <div class="mt-8 max-w-md mx-auto">
    <p-card>
      <div class="space-y-6">
        <!-- Card Element Container -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">
            Información de la Tarjeta
          </label>
          <div id="card-element" class="p-3 border border-gray-300 rounded-md">
            <!-- Stripe Elements will create form elements here -->
          </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end gap-4">
          <p-button
            type="button"
            [routerLink]="['/panel/payment-methods']"
            label="Cancelar"
            severity="secondary"
          />

          <p-button
            type="button"
            (click)="addPaymentMethod()"
            label="Agregar Método de Pago"
            severity="success"
            [disabled]="isLoading()"
            [loading]="isLoading()"
          />
        </div>
      </div>
    </p-card>
  </div>

  <!-- Toast Messages -->
  <p-toast />
</div>
