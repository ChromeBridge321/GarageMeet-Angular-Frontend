
<div class="dashboard-card">
  <div class="dashboard-card-header">
    <h3 class="dashboard-title">Piezas</h3>
    <p-button
      type="button"
      pRipple
      label="Nueva Pieza"
      icon="pi pi-plus"
      severity="success"
      (onClick)="openCreateModal()"
      tooltipPosition="top"
    />
  </div>

  <div class="dashboard-card-content">
    <div class="flex items-center justify-content-between align-items-center mb-4">
      <div class="flex align-items-center gap-3">
        <p-button
          icon="pi pi-filter-slash"
          label="Limpiar Filtros"
          severity="secondary"
          size="small"
          (onClick)="limpiarFiltros(piecesTable)"
          pTooltip="Limpiar todos los filtros aplicados">
        </p-button>
      </div>
      <div class="ps-4 flex align-items-center gap-2">
        <span class="text-sm text-gray-600">{{ pieces.length }} pieza(s) total(es)</span>
      </div>
    </div>

    <p-table
      showGridlines
      [value]="pieces"
      [tableStyle]="{ 'min-width': 'auto' }"
      [loading]="loading"
      [globalFilterFields]="['name', 'price']"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      paginatorDropdownAppendTo="body"
      #piecesTable>

      <ng-template #header>
        <tr>
          <th>N.</th>
          <th pSortableColumn="name">
            Nombre
            <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th>Acciones</th>
        </tr>
        <tr>
          <th></th>
          <th>
            <input pInputText type="text" (input)="piecesTable.filter($any($event.target).value, 'name', 'contains')"
                   placeholder="Filtrar por nombre" class="w-full" />
          </th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-piece let-index="rowIndex">
        <tr>
          <td>{{ index + 1 }}</td>
          <td>{{ piece.name }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-pencil"
                severity="secondary"
                size="small"
                [text]="true"
                (onClick)="openEditModal(piece)"
                pTooltip="Editar pieza"
                tooltipPosition="top"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                size="small"
                [text]="true"
                (onClick)="deletePiece(piece)"
                pTooltip="Eliminar pieza"
                tooltipPosition="top"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="3" class="text-center">
            <div class="py-8">
              <i class="pi pi-cog text-6xl text-gray-400 mb-4"></i>
              <h3 class="text-lg font-semibold text-gray-700 mb-2">No hay piezas registradas</h3>
              <p class="text-gray-500 mb-4">Comienza agregando tu primera pieza al sistema</p>
              <p-button
                label="Agregar Pieza"
                icon="pi pi-plus"
                severity="success"
                (onClick)="openCreateModal()">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Modal para crear/editar pieza -->
<p-dialog
  [header]="modalTitle"
  [(visible)]="showModal"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '500px' }"
  [breakpoints]="{ '768px': '90vw' }">

  <div class="space-y-4">
    <form>
      <div class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nombre de la Pieza *</label>
          <input
            id="name"
            type="text"
            pInputText
            [(ngModel)]="pieceForm.name"
            name="name"
            placeholder="Ej: Filtro de aceite, Pastillas de freno..."
            class="w-full" />
        </div>

        <div>
          <label for="price" class="block text-sm font-medium text-gray-700 mb-2">Precio *</label>
          <p-inputNumber
            id="price"
            [(ngModel)]="pieceForm.price"
            name="price"
            mode="currency"
            currency="USD"
            locale="en-US"
            [min]="0"
            [maxFractionDigits]="2"
            placeholder="0.00"
            class="w-full">
          </p-inputNumber>
        </div>
      </div>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        (onClick)="closeModal()">
      </p-button>
      <p-button
        [label]="isEditing ? 'Actualizar' : 'Crear'"
        [icon]="isEditing ? 'pi pi-check' : 'pi pi-plus'"
        severity="success"
        (onClick)="savePiece()">
      </p-button>
    </div>
  </ng-template>
</p-dialog>

<!-- Toast para notificaciones -->
<p-toast></p-toast>

<!-- Confirmación de eliminación -->
<p-confirmDialog></p-confirmDialog>
