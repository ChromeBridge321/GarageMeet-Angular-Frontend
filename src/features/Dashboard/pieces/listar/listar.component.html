<div class="pieces-container">
  <div class="card">
    <div class="card-header">
      <h2>Gestión de Piezas</h2>
      <p-button
        label="Nueva Pieza"
        icon="pi pi-plus"
        severity="success"
        (onClick)="openCreateModal()">
      </p-button>
    </div>

    <div class="card-content">
      <p-table
        #piecesTable
        [value]="pieces"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} piezas"
        [globalFilterFields]="['name', 'price']"
        responsiveLayout="scroll">

        <ng-template pTemplate="caption">
          <div class="table-header">
            <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input
                pInputText
                type="text"
                placeholder="Buscar piezas..."
                (input)="piecesTable.filterGlobal($any($event.target).value, 'contains')" />
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th>N.</th>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-piece let-index="rowIndex">
          <tr>
            <td>{{ index + 1 }}</td>
            <td>{{ piece.name }}</td>
            <td>
              <div class="action-buttons">
                <p-button
                  icon="pi pi-pencil"
                  severity="info"
                  size="small"
                  [text]="true"
                  (onClick)="openEditModal(piece)"
                  pTooltip="Editar pieza">
                </p-button>
                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  size="small"
                  [text]="true"
                  (onClick)="deletePiece(piece)"
                  pTooltip="Eliminar pieza">
                </p-button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-center">
              <div class="empty-state">
                <i class="pi pi-cog" style="font-size: 3rem; color: #6c757d;"></i>
                <h3>No hay piezas registradas</h3>
                <p>Comienza agregando tu primera pieza al sistema</p>
                <p-button
                  label="Agregar Pieza"
                  icon="pi pi-plus"
                  (onClick)="openCreateModal()">
                </p-button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <!-- Modal para crear/editar pieza -->
  <p-dialog
    [header]="modalTitle"
    [(visible)]="showModal"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="piece-dialog"
    [style]="{ width: '500px' }">

    <div class="form-container">
      <form>
        <div class="form-group">
          <label for="name">Nombre de la Pieza *</label>
          <input
            id="name"
            type="text"
            pInputText
            [(ngModel)]="pieceForm.name"
            name="name"
            placeholder="Ej: Filtro de aceite, Pastillas de freno..."
            class="w-full" />
        </div>

        <div class="form-group">
          <label for="price">Precio *</label>
          <p-inputNumber
            id="price"
            [(ngModel)]="pieceForm.price"
            name="price"
            mode="currency"
            currency="USD"
            locale="en-US"
            [min]="0"
            [maxFractionDigits]="2"
            placeholder="0.00"
            class="w-full">
          </p-inputNumber>
        </div>
      </form>
    </div>

    <ng-template pTemplate="footer">
      <div class="dialog-footer">
        <p-button
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          [text]="true"
          (onClick)="closeModal()">
        </p-button>
        <p-button
          [label]="isEditing ? 'Actualizar' : 'Crear'"
          [icon]="isEditing ? 'pi pi-check' : 'pi pi-plus'"
          severity="success"
          (onClick)="savePiece()">
        </p-button>
      </div>
    </ng-template>
  </p-dialog>

  <!-- Toast para notificaciones -->
  <p-toast></p-toast>

  <!-- Confirmación de eliminación -->
  <p-confirmDialog></p-confirmDialog>
</div>
