<p-toast />
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-zinc-900 via-zinc-800 to-zinc-900 p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-2xl animate-fade-in-up">
    <!-- Back Button -->
    <div class="mb-6">
      <a routerLink="/"
        class="inline-flex items-center text-zinc-600 hover:text-zinc-800 transition-colors duration-200">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Regresar al inicio
      </a>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-zinc-900 mb-2">Registrar Taller Mecánico</h1>
      <p class="text-zinc-600">Únete a nuestra red de talleres profesionales</p>
    </div>


    <form [formGroup]="mechanicalForm" (ngSubmit)="createMechanical(autocomplete.value)" class="space-y-6">
      <!-- Workshop Name Field -->
      <div>
        <label for="name" class="text-md-center font-semibold text-zinc-700 mb-2">
          Nombre del Taller
        </label>
        <input fluid="true" type="text" id="name" formControlName="name" pInputText
          placeholder="Nombre de tu taller mecánico" />
        <small class="text-red-500"
          *ngIf="mechanicalForm.get('name')?.invalid && (mechanicalForm.get('name')?.dirty || mechanicalForm.get('name')?.touched)">
          El nombre es requerido
        </small>
      </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-md-center font-semibold text-zinc-700 mb-2">
          Correo Electrónico
        </label>
        <input fluid="true" type="text" id="email" formControlName="email" pInputText
          placeholder="Correo electrónico" />
        <small class="text-red-500"
          *ngIf="mechanicalForm.get('email')?.invalid && (mechanicalForm.get('email')?.dirty || mechanicalForm.get('email')?.touched)">
          El correo electrónico es requerido
        </small>
      </div>

      <!-- Phone Field -->
      <div>
        <label for="cellphone_number" class="block text-md-center font-semibold text-zinc-700 mb-2">
          Número de Teléfono
        </label>
        <p-inputmask
          [style]="{'width': '100%'}"
          id="cellphone_number"
          autocomplete="off"
          formControlName="cellphone_number"
          mask="(999) 999-9999"
          placeholder="(999) 999-9999"
          />
        <small class="text-red-500"
          *ngIf="mechanicalForm.get('cellphone_number')?.invalid && (mechanicalForm.get('cellphone_number')?.dirty || mechanicalForm.get('cellphone_number')?.touched)">
          El número de teléfono es requerido
        </small>
      </div>

      <!-- State and City Fields in Grid -->
      <div class="w-full">
        <label for="states_id" class="block text-md-center font-semibold text-zinc-700 mb-2">
          Ubicación del Taller
        </label>
        <p-autocomplete placeholder="Ejemplo: Centro, Tabasco" class="w-full" size="large" #autocomplete [fluid]="true"
          [delay]="200" [forceSelection]="true" [suggestions]="items" (completeMethod)="search($event)"
          [optionLabel]="'name'">
          <ng-template let-city pTemplate="item">
            {{ city.name}}
          </ng-template>
        </p-autocomplete>
      </div>

      <!-- Address Field -->
      <div>
        <label for="address" class="block text-md-center font-semibold text-zinc-700 mb-2">
          Dirección
        </label>
        <textarea class="w-full" pInputText id="address" formControlName="address" rows="3"
          placeholder="Dirección completa del taller"></textarea>
        <small class="text-red-500"
          *ngIf="mechanicalForm.get('address')?.invalid && (mechanicalForm.get('address')?.dirty || mechanicalForm.get('address')?.touched)">
          La dirección es requerida
        </small>
      </div>

      <!-- Google Maps Link Field -->
      <div>
        <label for="google_maps_link" class="block text-md-center font-semibold text-zinc-700 mb-2">
          Enlace de Google Maps (Opcional)
        </label>
        <input fluid="true" type="url" id="google_maps_link" formControlName="google_maps_link" pInputText
          placeholder="https://maps.app.goo.gl/..." />
      </div>

      <!-- Terms and Conditions -->
      <div class="flex items-start text-md-center">
        <input type="checkbox" id="terms" class="mr-3 mt-1 accent-zinc-600 w-4 h-4" required>
        <label for="terms" class="text-zinc-700">
          Acepto los
          <a href="#"
            class="text-zinc-800 hover:text-zinc-900 font-medium transition-colors duration-200 hover:underline">
            términos y condiciones
          </a>
          para talleres mecánicos y la
          <a href="#"
            class="text-zinc-800 hover:text-zinc-900 font-medium transition-colors duration-200 hover:underline">
            política de privacidad
          </a>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="isLoading()"
        [class]="'w-full py-3 rounded-xl font-semibold transition-all duration-300 shadow-lg focus:outline-none focus:ring-4 focus:ring-zinc-300 ' +
                 (isLoading()
                   ? 'bg-zinc-400 cursor-not-allowed text-white'
                   : 'bg-gradient-to-r from-zinc-800 to-zinc-900 text-white hover:from-zinc-700 hover:to-zinc-800 transform hover:-translate-y-1 hover:shadow-xl')">
        @if (isLoading()) {
        <div class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Registrando taller...
        </div>
        } @else {
        Registrar Taller
        }
      </button>
    </form>

    <!-- Sign In Link -->
    <div class="text-center pt-6 border-t border-zinc-200">
      <p class="text-zinc-600">
        ¿Ya tienes un taller registrado?
        <a href="/login"
          class="text-zinc-800 hover:text-zinc-900 font-semibold transition-colors duration-200 hover:underline">
          Inicia sesión aquí
        </a>
      </p>
    </div>
  </div>
</div>
