[build]
  publish = "dist/garage-meet/browser"
  command = "npm run build:prod"

[build.environment]
  NODE_VERSION = "18"

# Headers para archivos APK
[[headers]]
  for = "/Apk/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=31536000"
    Content-Disposition = "attachment"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["anonymous"]}
  # Excluir archivos estáticos de la redirección SPA
  force = false
